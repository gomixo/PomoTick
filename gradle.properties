# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Disable build features we don't use
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=false

# v0.2 build env: Kotlin daemon is unreliable in sandboxed environments (file lock
# issues on kotlin-daemon-client-tsmarker*.tmp). Force non-daemon mode to fall back
# to in-process compilation, which is slower but always works.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.useFallbackStrategy=true
